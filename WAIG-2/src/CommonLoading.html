<!--
======================================================
CommonLoading.html

共通ローディング部品

注意:
このファイルは include() で各Viewに埋め込まれる
パーシャルHTMLである。

そのため

<html>
<head>
<body>

は記述しない。

style / html / script のみ記述する。

利用例:

<body>

<?!= include('CommonLoading') ?>

...

</body>

======================================================
-->

<style>

#loading-overlay {
  display: none;

  position: fixed;

  top: 0;
  left: 0;

  width: 100%;
  height: 100%;

  background: rgba(0, 0, 0, 0.3);

  z-index: 9999;
}

.loading-box {

  position: absolute;

  top: 50%;
  left: 50%;

  transform: translate(-50%, -50%);

  background: white;

  padding: 24px;

  border-radius: 8px;

  box-shadow: 0 2px 8px rgba(0,0,0,0.2);

  text-align: center;
}

.spinner {

  width: 40px;
  height: 40px;

  margin: 0 auto 12px;

  border: 4px solid #dddddd;

  border-top: 4px solid #fbc02d;

  border-radius: 50%;

  animation: loading-spin 1s linear infinite;
}

@keyframes loading-spin {

  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }
}

.loading-text {

  font-size: 16px;

  font-weight: bold;

  color: #333333;
}

</style>


<div id="loading-overlay">

  <div class="loading-box">

    <div class="spinner"></div>

    <div class="loading-text">
      処理中...
    </div>

  </div>

</div>


<script>

/**
 * @summary クライアント共通処理：ローディング表示を表示する
 * @function showLoading
 * @read loading-overlay 要素
 * @write loading-overlay 要素のdisplayをblockに変更する
 * @update 2026-06-30
 */
function showLoading() {

  const overlay =
    document.getElementById(
      'loading-overlay'
    );

  if (overlay) {

    overlay.style.display =
      'block';
  }
}

function hideLoading() {

  const overlay =
    document.getElementById(
      'loading-overlay'
    );

  if (overlay) {

    overlay.style.display =
      'none';
  }
}

</script>
